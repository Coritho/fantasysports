name: Update NFL player data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 2"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install updater dependencies
        working-directory: updater
        run: npm install

      - name: Update NFL player data
        working-directory: updater
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: fantasy-sports-101
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm run update
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"